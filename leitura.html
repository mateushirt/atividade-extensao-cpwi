<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />
    <title>Página inicial</title>
</head>
<body>
    <header class="segment-header">
        <div class="row">
            <div class="return-button">
                <a href="index.html"><span class="material-symbols-outlined">arrow_back</span></a>
            </div>

            <div class="segment-info">
                <strong>Fazer a leitura</strong>
                <p>Passo 1 de 2 - Número no hidrômetro</p>
            </div>
        </div>

        <div class="progress-bar">
            <div class="complete"></div>
            <div class="incomplete"></div>
        </div>
    </header>

    <main>
        <section class="step read">
            <p>Quais os <strong>números pretos</strong> que estão aparecendo <strong>no seu medidor</strong>?</p>
            <img src="numero-medidor-placeholder.jpg" alt="">

            <div class="numeros-medidor">
                <!-- AS FUNÇÕES SÃO PLACEHOLDER -->
                <input type="number" class="numero" value="0" maxlength="1" onfocus="this.select();" oninput="meter_next_number();">
                <input type="number" class="numero" value="0" maxlength="1" onfocus="this.select();" oninput="meter_next_number();">
                <input type="number" class="numero" value="0" maxlength="1" onfocus="this.select();" oninput="meter_next_number();">
                <input type="number" class="numero" value="0" maxlength="1" onfocus="this.select();" oninput="meter_next_number();">
            </div>

            <div class="button-row">
                <button class="secondary" onclick="location.href='index.html';">Cancelar</button>
                <button class="primary" onclick="read_step(+1);">Próximo &rarr;</button> <!-- PLACEHOLDER -->
            </div>
        </section>

        <section class="step read" hidden> <!-- Hidden por enquanto -->
            <p>Tire ou envie uma <strong>foto do medidor</strong> com os <strong>números visíveis</strong>:</p>
            
            [Pré-visualização da imagem]
            
            <button class="secondary" onclick="read_step(-1);">&larr; Voltar</button> <!-- PLACEHOLDER -->
            <button class="primary" onclick="read_step(+1);">Finalizar a leitura</button> <!-- PLACEHOLDER -->
        </section>
    </main>
</body>
</html>
