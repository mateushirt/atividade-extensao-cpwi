<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Página inicial</title>
</head>
<body>
    <header class="segment-header">
        <div class="return-button">
            <a href="index.html">
                <i>Voltar</i>
            </a>
        </div>

        <div class="segment-info">
            <strong>Fazer a leitura</strong>
            <p>Passo 1 de 2 - Número no hidrômetro</p>
            
            <div class="progress-bar">
                <div class="complete"></div>
                <div class="incomplete"></div>
            </div>
        </div>
    </header>

    <main>
        <section class="step read">
            <p>Quais os <strong>números pretos</strong> que estão aparecendo <strong>no seu medidor</strong>?</p>
            <img src="img-placeholder.jpg" alt="">

            <div class="numeros-medidor">0000</div>

            <button class="secondary">Cancelar</button>
            <button class="primary">Próximo &rarr;</button>
        </section>

        <section class="step read">
            <p>Tire ou envie uma <strong>foto do medidor</strong> com os <strong>números visíveis</strong>:</p>
            
            [Pré-visualização da imagem]

            <button class="secondary">&larr; Voltar</button>
            <button class="primary">Finalizar a leitura</button>
        </section>
    </main>
</body>
</html>
