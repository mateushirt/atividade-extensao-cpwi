<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222222">
    <link rel="stylesheet" href="styles/styles.css">
	<link rel="stylesheet" href="styles/segment-style.css">
    <title>Página inicial</title>
	
	<!-- Dados que vão ir ao localStorage -->
    <script src="dados.js"></script>
</head>
<body>
    <header class="segment-header">
        <div class="row">
            <div class="return-button" title="Voltar para a tela inicial">
                <a href="index.html"><span class="material-symbols-outlined">arrow_back</span></a>
            </div>

            <div class="segment-info">
                <span class="step-title">Histórico e Pagamento</span>
                <span class="step-info">Casa 321 (Nome da casa aqui)</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="complete"></div>
        </div>
    </header>

    <main>
		<section class="row-container">
			<section class="boxes-container">
				<div class="number-box last-month">
					<h3>Último mês</h3>
					<span>0 m³</span>
				</div>

				<div class="number-box average">
					<h3>Média (06 meses)</h3>
					<span>0 m³</span>
				</div>
				
				<div class="number-box average">
					<h3>Mês maior consumo (06 meses)</h3>
					<span>- / -</span>
				</div>
			</section>

			<!-- Gráfico de consumo -->
			<section class="container">
				<h3>Consumo dos últimos seis meses</h3>

				<div class="bar-graph">Não há leituras ainda</div>

				<button class="secondary"><a href="PLACEHOLDER">Ver mais meses &rarr;</a></button>
			</section>
		</section>

		<!-- Faturas anteriores -->
		<section class="container">
			<h3>Faturas anteriores</h3>
			<div id="bills">Não há faturas anteriores</div>
		</section>
    </main>

    <script src="interaction.js"></script>
</body>
</html>
